name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CurrencyTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CurrencyTracker-apk
          path: CurrencyTracker.apk

      # The app checks the latest release and offers to install it.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-d1771aa3-0t6q66'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ github.run_number }}" CurrencyTracker.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
